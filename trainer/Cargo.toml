[package]
name = "trainer"
version = "0.1.0"
edition = "2024"
description = "NNUE training with bullet (CUDA)"

# Standalone: needs the CUDA toolkit, so it stays out of the engine workspace.
[workspace]

[dependencies]
bullet_lib = { git = "https://github.com/jw1912/bullet", rev = "23a8fddff202106c2e50418609ea6c2596f983e8", features = ["cuda"] }

[profile.release]
opt-level = 3
codegen-units = 1
